[package]
name = "lingqi"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "灵栖：会呼吸的桌面灵动岛与 AI 伙伴"
# TODO(发布前替换)：改成你自己的仓库地址，更新检查与安装包链接都依赖它
repository = "https://github.com/NingYuanLee/lingqi"
default-run = "lingqi"

[lib]
name = "lingqi"
path = "src/lib.rs"

[[bin]]
name = "lingqi"
path = "src/main.rs"

# 无窗口演示录制器：脚本驱动 + 软件光栅化，输出 RGBA 帧流给 ffmpeg。
[[bin]]
name = "lingqi-record"
path = "src/bin/lingqi-record/main.rs"
required-features = ["record"]

[features]
record = []

material = [
  "dep:bytemuck",
  "eframe/direct-composition",
  "windows/Graphics", "windows/Graphics_Capture", "windows/Graphics_DirectX", "windows/Graphics_DirectX_Direct3D11",
  "windows/Win32_Graphics_Direct3D", "windows/Win32_Graphics_Direct3D11",
  "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common",
  "windows/Win32_System_WinRT_Direct3D11", "windows/Win32_System_WinRT_Graphics_Capture",
]


[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui = { path = "vendor/egui" }
egui-wgpu = { path = "vendor/egui-wgpu" }
egui-winit = { path = "vendor/egui-winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }
ureq = { path = "vendor/ureq" }

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts", "direct-composition"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image"] }
# 绘制内核：精灵与后续自研渲染器直接用它，不经过 egui 的 UI 框架。
# 版本必须与 egui 0.31 依赖的 epaint 一致，否则类型对不上。
epaint = "=0.31.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "0.6"
# v0.5.5 邮件：MIME 解析与验证码打分是纯逻辑，保持跨平台。
regex = "1"
url = "2"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }

# Linux 下 winit 至少要一个后端才能编译（只用于开发/录制，正式目标是 Windows）。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = "0.4"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
clipboard-win = "5.4.3"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
memmap2 = "0.9.12"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Wdk_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_System_Performance", "Wdk_System_SystemInformation", "Win32_System_ProcessStatus",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_TextServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics",
  "UI_Notifications_Management",
  "UI_Notifications", "ApplicationModel",
  "Win32_System_Ole", "Win32_UI_Shell_Common", "Networking_Connectivity",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth",
  "Devices_Bluetooth", "Devices_Enumeration", "Devices_Bluetooth_GenericAttributeProfile",
] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_EventLog", "Win32_System_ProcessStatus"] }
# v0.5.5 邮件：IMAP 走系统 TLS，凭据进 Windows 凭据管理器。
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# 测试里要同步等待 wgpu 创建设备。
pollster = "0.4"
# 像素对拍要拿 egui-wgpu 的渲染器做参照。
egui-wgpu = { path = "vendor/egui-wgpu" }
